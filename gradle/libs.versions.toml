# Lumen Glass — version catalog.
# Pinned to the toolchain used by the 360 Community project so the library can be developed and
# tested against it. (Android-first; KMP / Kotlin 2.4 / AGP 9 is deliberately deferred — see
# docs/lumen-glass/PLAN.md §4 Q1 and the Risks table.)
[versions]
agp = "8.13.2"
kotlin = "2.2.20"
composeBom = "2026.06.01"
androidxCoreKtx = "1.17.0"
androidxActivityCompose = "1.11.0"
androidxTestExtJunit = "1.3.0"
androidxTestRunner = "1.7.0"
benchmarkMacroJunit4 = "1.5.0"
uiautomator = "2.4.0"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCoreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivityCompose" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-ui = { module = "androidx.compose.ui:ui" }
androidx-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-material3 = { module = "androidx.compose.material3:material3" }
# NOTE: named `androidx-test-junit-ext`, not `androidx-test-ext-junit`: the latter generates the
# accessor `libs.androidx.test.ext.junit`, and `.ext` collides with the Kotlin DSL's own extension
# accessor inside a dependencies {} block.
androidx-test-junit-ext = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
# Macrobenchmark: frame-timing measurement (PLAN §6.1 prescribes it). Separate from the
# androidTest deps because it runs in its own :benchmark module against a profileable build.
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmarkMacroJunit4" }
androidx-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
# NOTE: deliberately named `android-app`, not `android-application`: the latter generates the
# accessor `libs.plugins.android.application`, which collides with the built-in `application`
# accessor on PluginDependenciesSpec inside a `plugins {}` block.
android-app = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# com.android.test — the Macrobenchmark module.
# NOTE: named `android-benchmark`, not `android-test`: the latter generates the accessor
# `libs.plugins.android.test`, and `.test` collides with the Kotlin DSL's own accessors inside a
# `plugins {}` block (the same class of clash as `android-app`).
android-benchmark = { id = "com.android.test", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
