# ---------------------------------------------------------------------------
# GitHub Pages (Jekyll) configuration — https://subhankarcodegeek.github.io/lumen-glass/
#
# The published site has two surfaces:
#   * /            → index.html, rendered through _layouts/landing.html
#   * /docs/*.html → docs/*.md, rendered through _layouts/docs.html
# plus assets/, which holds the screenshots both of them use.
#
# index.html is a real file, so jekyll-readme-index no longer promotes README.md
# to the site root: the README stays the repository's technical front door on
# GitHub and this landing page owns the website.
#
# Everything Android/Gradle related is excluded so the Jekyll build stays fast
# and deterministic. A stale or failed Pages build is the reason a
# google-site-verification file can appear to "not exist" (Google gets a 404 and
# the verification fails), so keeping the build small and reliable matters.
# ---------------------------------------------------------------------------

# Shown as the page heading and in og:site_name.
title: Lumen Glass

# jekyll-seo-tag builds <title> as "title | tagline" — keep it keyword-led and
# under ~60 characters so it is not truncated in search results.
tagline: Liquid glass shaders for Android & Jetpack Compose

# Used for <meta name="description"> and og:description. ~155 characters keeps
# it intact in the SERP snippet, and it carries the terms people actually search
# for: AGSL shader library, Android, Jetpack Compose, glassmorphism, refraction.
description: >-
  Open-source AGSL shader library for Android & Jetpack Compose.
  GPU-accelerated liquid glass with real refraction, chromatic dispersion
  and adaptive blur.

url: "https://subhankarcodegeek.github.io"
baseurl: "/lumen-glass"

# Social preview card, 1200x630.
#
# Note: jekyll-seo-tag reads page.image (front matter), NOT site.image, so the
# defaults block below is what actually applies this. With it set the tag emits
# og:image + twitter:image and upgrades twitter:card to summary_large_image.
image: /assets/og-image.png

defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/og-image.png
        width: 1200
        height: 630
        alt: Lumen Glass — liquid glass shaders for Android and Jetpack Compose

  # Render the Markdown notes with the site's own layout instead of the theme's.
  - scope:
      path: "docs"
    values:
      layout: docs

  # CLEANROOM.md lives at the repository root but is published as a documentation
  # page (the footer and the landing page both link to it), so it gets the same
  # layout.
  - scope:
      path: "CLEANROOM.md"
    values:
      layout: docs

author: SubhankarCodeGeek

# Pinned to the theme already in use, so the styling does not depend on the
# repository's Pages setting surviving future configuration changes.
theme: jekyll-theme-primer

plugins:
  - jekyll-seo-tag

# sitemap.xml and robots.txt are maintained by hand instead of via
# jekyll-sitemap: the plugin also listed /assets/ (a rendering artifact) and the
# Search Console verification file, neither of which belongs in a sitemap.

markdown: kramdown
kramdown:
  input: GFM

exclude:
  # --- Android modules (source is not part of the site) ---
  - app
  - library
  - benchmark

  # --- Build output & Gradle ---
  - build
  - gradle
  - gradlew
  - gradlew.bat
  - settings.gradle.kts
  - build.gradle.kts
  - gradle.properties
  - local.properties
  - jitpack.yml

  # --- Tooling / IDE state ---
  - .gradle
  - .kotlin
  - .idea
  - .github
  - .vscode
  - scripts

  # --- Binaries / notes not referenced by the rendered site ---
  - assets/lumen_demo.mp4
  - assets/README.md
