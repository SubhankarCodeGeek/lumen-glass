  crawler associate the page with the repository, language and licence instead of
  treating it as an anonymous web page.

  Kept as static JSON — no Liquid — so the block validates as JSON and needs no
  escaping. Only facts verifiable in this repository are asserted: no ratings,
  download counts, prices or affiliations. If the Pages URL or baseurl changes,

-->
