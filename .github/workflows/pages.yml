# Builds the website (index.html + _layouts/ + docs/ + assets/) with the same
# Jekyll toolchain GitHub Pages uses, validates the output, and deploys it to
# https://subhankarcodegeek.github.io/lumen-glass/
#
# Required because the repository's Pages source is "GitHub Actions": there is no
# implicit build on push, so without this workflow commits never reach the site.
#
# Third-party actions are pinned to commit SHAs (with the release noted in a
# comment) so a mutable tag cannot silently change what runs here.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    # Only republish when something that is actually published changed, so
    # Android-only commits do not churn the site.
    paths:
      - "index.html"
      - "_config.yml"
      - "_layouts/**"
      - "_includes/**"
      - "assets/**"
      - "docs/**"
      - "README.md"
      - "CLEANROOM.md"
      - "LICENSE"
      - "robots.txt"
      - "sitemap.xml"
      - "google09ae51d459da8d85.html"
      - "scripts/validate_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress deployment finish rather than cancelling it, so the site is
# never left half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Search Console "HTML file" ownership verification depends on this exact
      # file being served at the site root. Deleting it revokes verification, so
      # fail the build rather than silently un-publish the site's ownership proof.
      - name: Guard Search Console verification file (source)
        run: |
          set -euo pipefail
          file=google09ae51d459da8d85.html
          want="google-site-verification: ${file}"

          if [ ! -f "$file" ]; then
            echo "::error::$file is missing from the repository root. Removing it revokes Google Search Console ownership verification."
            exit 1
          fi

          got="$(tr -d '\r\n' < "$file")"
          if [ "$got" != "$want" ]; then
            echo "::error::$file content mismatch. Expected '$want' but found '$got'."
            exit 1
          fi

          echo "$file is present and its body is correct."

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./
          destination: ./_site

      # Guards the other failure mode: the file exists in git but never reaches
      # the published site because an _config.yml `exclude:` entry (or a future
      # Jekyll processing rule) swallowed it.
      - name: Guard Search Console verification file (built site)
        run: |
          set -euo pipefail
          file=_site/google09ae51d459da8d85.html

          if [ ! -f "$file" ]; then
            echo "::error::$file was not published. Check the exclude: list in _config.yml."
            exit 1
          fi

          echo "Verification file survived the Jekyll build."

      # Checks the built HTML, not the sources: required files, every local
      # link and asset, canonical/OG/Twitter metadata, JSON-LD syntax, img alt
      # attributes, and the sitemap. A broken build fails here, before deploy.
      - name: Validate the published site
        run: |
          python3 scripts/validate_site.py \
            --site ./_site \
            --baseurl /lumen-glass \
            --origin https://subhankarcodegeek.github.io

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
