# Lumen Glass — Gradle properties (standalone project).
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 --add-opens java.base/java.lang=ALL-UNNAMED --add-opens java.base/java.util=ALL-UNNAMED
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
